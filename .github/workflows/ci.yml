name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # If a new advisory blocks a PR with no fix available yet, a maintainer
      # can temporarily narrow this to --omit=dev while a real fix lands.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Lint
        run: python -m ruff check pipeline

      - name: Test
        run: python -m pytest pipeline/tests

      # If a new advisory blocks a PR with no fix available yet, a maintainer
      # can temporarily add --ignore-vuln <ID> here while a real fix lands.
      - name: Audit dependencies
        run: pip-audit -r pipeline/requirements.txt
